<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--sfondo);color:var(--testo);font-family:var(--font-corpo);padding:16px;font-size:16px}
.griglia{display:grid;gap:10px}.sw{border-radius:var(--raggio-piccolo);border:1px solid rgba(0,0,0,.08);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-family:var(--font-mono)}
.meta{font-size:12px;color:var(--testo-tenue);font-family:var(--font-mono);margin:4px 0 0}
.riga{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div class="griglia" style="grid-template-columns:repeat(3,1fr)">
<div><div class="sw" style="background:var(--mare);color:#fff">mare</div><p class="meta">mare · #0B90CB</p></div><div><div class="sw" style="background:var(--terra);color:#fff">terra</div><p class="meta">terra · #CC7E5B</p></div><div><div class="sw" style="background:var(--sole);color:#1C1C1A">sole</div><p class="meta">sole · #F6AF37</p></div>
</div></body></html>
