<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--sfondo);color:var(--testo);font-family:var(--font-corpo);padding:16px;font-size:16px}
.griglia{display:grid;gap:10px}.sw{border-radius:var(--raggio-piccolo);border:1px solid rgba(0,0,0,.08);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-family:var(--font-mono)}
.meta{font-size:12px;color:var(--testo-tenue);font-family:var(--font-mono);margin:4px 0 0}
.riga{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div class="riga" style="align-items:center">
<button style="font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:10px 18px;border-radius:10px;border:2px solid var(--bordo-forte);background:#fff;color:var(--azione);outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px var(--focus-contorno)">Focus su carta</button>
<div style="background:var(--testata);padding:16px;border-radius:10px"><button style="font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:10px 18px;border-radius:10px;border:2px solid #fff;background:transparent;color:#fff;outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px var(--focus-contorno)">Focus sulla testata</button></div>
</div><p class="meta">outline 3 px --focus (#F6AF37) + box-shadow 6 px --focus-contorno (#043044): resta visibile su entrambe le superfici.</p></body></html>
