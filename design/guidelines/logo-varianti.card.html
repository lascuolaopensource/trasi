<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--sfondo);color:var(--testo);font-family:var(--font-corpo);padding:16px;font-size:16px}
.griglia{display:grid;gap:10px}.sw{border-radius:var(--raggio-piccolo);border:1px solid rgba(0,0,0,.08);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-family:var(--font-mono)}
.meta{font-size:12px;color:var(--testo-tenue);font-family:var(--font-mono);margin:4px 0 0}
.riga{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
<div style="background:#fff;border:1px solid var(--bordo-tenue);border-radius:var(--raggio);padding:12px"><img src="../assets/logo-case-di-quartiere-colore.png" alt="logo a colori" style="width:100%"></div>
<div style="background:var(--mare-notte);border-radius:var(--raggio);padding:12px"><img src="../assets/logo-case-di-quartiere-bianco.png" alt="logo bianco" style="width:100%"></div>
<div style="background:#fff;border:1px solid var(--bordo-tenue);border-radius:var(--raggio);padding:12px"><img src="../assets/logo-case-di-quartiere-blu.png" alt="logo blu" style="width:100%"></div>
<div style="background:var(--inchiostro);border-radius:var(--raggio);padding:12px"><img src="../assets/logo-case-di-quartiere-giallo.png" alt="logo giallo" style="width:100%"></div>
</div></body></html>
