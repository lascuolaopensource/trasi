<!-- @dsCard group="Colors" viewport="700x170" name="Contrasti misurati" subtitle="Ogni coppia testo/sfondo in uso, con il rapporto" -->
<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--sfondo);color:var(--testo);font-family:var(--font-corpo);padding:16px;font-size:16px}
.griglia{display:grid;gap:10px}.sw{border-radius:var(--raggio-piccolo);border:1px solid rgba(0,0,0,.08);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-family:var(--font-mono)}
.meta{font-size:12px;color:var(--testo-tenue);font-family:var(--font-mono);margin:4px 0 0}
.riga{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
<div style="background:var(--carta);border:2px solid var(--bordo-tenue);border-radius:var(--raggio);padding:10px">testo su carta <span class="meta">15,39:1</span></div>
<div style="background:var(--testata);color:#fff;border-radius:var(--raggio);padding:10px">bianco su testata <span style="font-family:var(--font-mono);font-size:12px;opacity:.85">11,12:1</span></div>
<div style="background:var(--superficie);border:2px solid var(--bordo-tenue);border-radius:var(--raggio);padding:10px;color:var(--azione)">collegamento su bianco <span class="meta">7,90:1</span></div>
<div style="background:var(--sole-tenue);color:var(--sole-scuro);border-radius:var(--raggio);padding:10px">attenzione <span style="font-family:var(--font-mono);font-size:12px">6,71:1</span></div>
<div style="background:var(--kb-sfondo);color:var(--kb-testo);border-radius:var(--raggio);padding:10px">KB <span style="font-family:var(--font-mono);font-size:12px">7,3:1</span></div>
<div style="background:var(--esterna-sfondo);color:var(--esterna-scuro,var(--terra-scuro));border-radius:var(--raggio);padding:10px">Esterna <span style="font-family:var(--font-mono);font-size:12px">7,9:1</span></div>
</div></body></html>
