<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--sfondo);color:var(--testo);font-family:var(--font-corpo);padding:16px;font-size:16px}
.griglia{display:grid;gap:10px}.sw{border-radius:var(--raggio-piccolo);border:1px solid rgba(0,0,0,.08);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-family:var(--font-mono)}
.meta{font-size:12px;color:var(--testo-tenue);font-family:var(--font-mono);margin:4px 0 0}
.riga{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-griglia)">
<div style="background:var(--superficie);border:2px solid var(--bordo);border-radius:var(--raggio);padding:var(--padding-scheda)"><p style="margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--azione)">MAPPA</p><p style="margin:0">Luoghi, servizi e Case vicine.</p><p class="meta">padding --s-5 · gap --s-5</p></div>
<div style="background:var(--superficie);border:2px solid var(--bordo);border-radius:var(--raggio);padding:var(--padding-scheda)"><p style="margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--azione)">OSSERVATORIO</p><p style="margin:0">I numeri della Casa e le proposte da approvare.</p><p class="meta">bersaglio minimo 44 px</p></div>
</div></body></html>
