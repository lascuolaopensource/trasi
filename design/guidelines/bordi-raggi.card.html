<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--sfondo);color:var(--testo);font-family:var(--font-corpo);padding:16px;font-size:16px}
.griglia{display:grid;gap:10px}.sw{border-radius:var(--raggio-piccolo);border:1px solid rgba(0,0,0,.08);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-family:var(--font-mono)}
.meta{font-size:12px;color:var(--testo-tenue);font-family:var(--font-mono);margin:4px 0 0}
.riga{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div class="riga">
<div style="background:#fff;border:1px solid var(--bordo-tenue);border-radius:4px;padding:12px 14px">1 px · raggio 4</div>
<div style="background:#fff;border:2px solid var(--bordo);border-radius:10px;padding:12px 14px">2 px · raggio 10</div>
<div style="background:#fff;border:2px solid var(--bordo-tenue);border-left:4px solid var(--coda-filetto);border-radius:10px;padding:12px 14px">filetto 4 px</div>
<div style="background:#fff;border:2px solid var(--bordo-forte);border-radius:10px;padding:12px 14px">bordo forte</div>
</div><p class="meta">Nessuna ombra: la gerarchia si legge da dimensione e spazio. L'unica ombra ammessa (--ombra-livello) è per un livello che galleggia davvero.</p></body></html>
