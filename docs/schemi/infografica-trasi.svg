<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2400" viewBox="0 0 1200 2400" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#123043"/>
      <stop offset="100%" stop-color="#081a26"/>
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ef8354"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="2400" fill="url(#bgGrad)"/>

  <!-- titolo -->
  <text x="600" y="110" text-anchor="middle" font-size="64" font-weight="800" fill="#f7f9fb">TRASI</text>
  <text x="600" y="160" text-anchor="middle" font-size="26" fill="#9fc0cf">La memoria viva del Portierato di Quartiere</text>
  <text x="600" y="196" text-anchor="middle" font-size="19" fill="#5f7f90">Rete delle Case di Quartiere di Brindisi</text>

  <!-- ============ SCENA 1: LA DOMANDA ============ -->
  <g filter="url(#soft)">
    <rect x="80" y="250" width="1040" height="360" rx="28" fill="#0f2c3d" stroke="#1e4761" stroke-width="2"/>
  </g>
  <text x="600" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#ffd166">1 · LA DOMANDA</text>

  <!-- persona + operatore -->
  <circle cx="230" cy="420" r="46" fill="#ef8354"/>
  <rect x="198" y="466" width="64" height="80" rx="26" fill="#ef8354"/>
  <circle cx="430" cy="420" r="46" fill="#4ecdc4"/>
  <rect x="398" y="466" width="64" height="80" rx="26" fill="#4ecdc4"/>
  <text x="230" y="580" text-anchor="middle" font-size="20" fill="#cfe3ee">cittadino</text>
  <text x="430" y="580" text-anchor="middle" font-size="20" fill="#cfe3ee">operatore</text>

  <!-- speech bubble -->
  <g filter="url(#soft)">
    <rect x="540" y="360" width="520" height="150" rx="24" fill="#f7f9fb"/>
    <polygon points="540,430 500,450 540,470" fill="#f7f9fb"/>
  </g>
  <text x="800" y="410" text-anchor="middle" font-size="24" font-weight="600" fill="#16324a">«Dove posso trovare</text>
  <text x="800" y="445" text-anchor="middle" font-size="24" font-weight="600" fill="#16324a">un aiuto adesso?»</text>
  <text x="800" y="485" text-anchor="middle" font-size="17" fill="#5f7f90">l'operatore chiede a Trasi, in parole normali</text>

  <!-- freccia giù -->
  <polygon points="600,630 566,700 634,700" fill="url(#arrowGrad)"/>
  <rect x="590" y="700" width="20" height="60" fill="url(#arrowGrad)"/>

  <!-- ============ SCENA 2: IL CERVELLO ============ -->
  <g filter="url(#soft)">
    <rect x="80" y="780" width="1040" height="470" rx="28" fill="#0f2c3d" stroke="#1e4761" stroke-width="2"/>
  </g>
  <text x="600" y="840" text-anchor="middle" font-size="30" font-weight="700" fill="#4ecdc4">2 · UN SOLO CERVELLO</text>

  <!-- cilindro DB -->
  <g filter="url(#soft)">
    <ellipse cx="600" cy="960" rx="200" ry="46" fill="#1e90b8"/>
    <rect x="400" y="960" width="400" height="150" fill="#156d90"/>
    <ellipse cx="600" cy="1110" rx="200" ry="46" fill="#0f4b66"/>
  </g>
  <text x="600" y="1020" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">TUTTA LA RETE</text>
  <text x="600" y="1055" text-anchor="middle" font-size="19" fill="#bfe3f2">10 Case · servizi · luoghi · eventi</text>
  <text x="600" y="1083" text-anchor="middle" font-size="19" fill="#bfe3f2">con data e fonte di ogni informazione</text>

  <!-- icone input -->
  <g font-size="19" fill="#cfe3ee" text-anchor="middle">
    <text x="185" y="920">chat</text>
    <text x="185" y="946" fill="#7fa8bd">operatore</text>
    <text x="185" y="1080">calendari</text>
    <text x="185" y="1106" fill="#7fa8bd">delle Case</text>
    <text x="1015" y="920">siti pubblici</text>
    <text x="1015" y="946" fill="#7fa8bd">· mappe aperte</text>
    <text x="1015" y="1080">report</text>
    <text x="1015" y="1106" fill="#7fa8bd">per tutti</text>
  </g>
  <path d="M 240 940 L 390 985" stroke="#4ecdc4" stroke-width="4" fill="none" marker-end="url(#m1)"/>
  <path d="M 240 1080 L 390 1055" stroke="#4ecdc4" stroke-width="4" fill="none"/>
  <path d="M 960 940 L 810 985" stroke="#ffd166" stroke-width="4" fill="none"/>
  <path d="M 960 1080 L 810 1055" stroke="#ffd166" stroke-width="4" fill="none"/>

  <polygon points="600,1270 566,1340 634,1340" fill="url(#arrowGrad)"/>
  <rect x="590" y="1340" width="20" height="60" fill="url(#arrowGrad)"/>

  <!-- ============ SCENA 3: LE REGOLE ============ -->
  <g filter="url(#soft)">
    <rect x="80" y="1420" width="1040" height="470" rx="28" fill="#0f2c3d" stroke="#1e4761" stroke-width="2"/>
  </g>
  <text x="600" y="1480" text-anchor="middle" font-size="30" font-weight="700" fill="#ef8354">3 · LE REGOLE D'ORO</text>

  <!-- regola 1 -->
  <g filter="url(#soft)">
    <rect x="140" y="1520" width="440" height="140" rx="20" fill="#123f57"/>
  </g>
  <circle cx="200" cy="1590" r="34" fill="#ffd166"/>
  <text x="200" y="1600" text-anchor="middle" font-size="30" font-weight="800" fill="#16324a">1</text>
  <text x="255" y="1575" font-size="22" font-weight="700" fill="#ffffff">Mai senza fonte</text>
  <text x="255" y="1605" font-size="17" fill="#9fc0cf">ogni risposta dice chi lo dice,</text>
  <text x="255" y="1630" font-size="17" fill="#9fc0cf">quando e quanto fidarsi</text>

  <!-- regola 2 -->
  <g filter="url(#soft)">
    <rect x="620" y="1520" width="440" height="140" rx="20" fill="#123f57"/>
  </g>
  <circle cx="680" cy="1590" r="34" fill="#4ecdc4"/>
  <text x="680" y="1600" text-anchor="middle" font-size="30" font-weight="800" fill="#16324a">2</text>
  <text x="735" y="1575" font-size="22" font-weight="700" fill="#ffffff">L'umano decide</text>
  <text x="735" y="1605" font-size="17" fill="#9fc0cf">l'AI propone, un operatore approva,</text>
  <text x="735" y="1630" font-size="17" fill="#9fc0cf">poi il dato diventa reale</text>

  <!-- regola 3 -->
  <g filter="url(#soft)">
    <rect x="140" y="1690" width="440" height="140" rx="20" fill="#123f57"/>
  </g>
  <circle cx="200" cy="1760" r="34" fill="#ef8354"/>
  <text x="200" y="1770" text-anchor="middle" font-size="30" font-weight="800" fill="#16324a">3</text>
  <text x="255" y="1745" font-size="22" font-weight="700" fill="#ffffff">Niente si perde</text>
  <text x="255" y="1775" font-size="17" fill="#9fc0cf">ogni cambiamento resta tracciato:</text>
  <text x="255" y="1800" font-size="17" fill="#9fc0cf">chi, cosa, quando, perché</text>

  <!-- regola 4 -->
  <g filter="url(#soft)">
    <rect x="620" y="1690" width="440" height="140" rx="20" fill="#123f57"/>
  </g>
  <circle cx="680" cy="1760" r="34" fill="#9b5de5"/>
  <text x="680" y="1770" text-anchor="middle" font-size="30" font-weight="800" fill="#16324a">4</text>
  <text x="735" y="1745" font-size="22" font-weight="700" fill="#ffffff">Dignità dei dati</text>
  <text x="735" y="1775" font-size="17" fill="#9fc0cf">niente nomi di persone dentro;</text>
  <text x="735" y="1800" font-size="17" fill="#9fc0cf">sotto 5 casi il numero non si mostra</text>

  <polygon points="600,1910 566,1980 634,1980" fill="url(#arrowGrad)"/>
  <rect x="590" y="1980" width="20" height="60" fill="url(#arrowGrad)"/>

  <!-- ============ SCENA 4: IL RISULTATO ============ -->
  <g filter="url(#soft)">
    <rect x="80" y="2060" width="1040" height="280" rx="28" fill="#0f2c3d" stroke="#1e4761" stroke-width="2"/>
  </g>
  <text x="600" y="2120" text-anchor="middle" font-size="30" font-weight="700" fill="#9b5de5">4 · IL RISULTATO</text>

  <g font-size="21" fill="#cfe3ee" text-anchor="middle">
    <text x="255" y="2190" font-weight="700" fill="#ffffff" font-size="24">Per chi chiede aiuto</text>
    <text x="255" y="2228">una risposta giusta,</text>
    <text x="255" y="2256">stampata su un biglietto</text>
  </g>
  <g font-size="21" fill="#cfe3ee" text-anchor="middle">
    <text x="600" y="2190" font-weight="700" fill="#ffffff" font-size="24">Per la rete</text>
    <text x="600" y="2228">i bisogni reali contati,</text>
    <text x="600" y="2256">non indovinati</text>
  </g>
  <g font-size="21" fill="#cfe3ee" text-anchor="middle">
    <text x="945" y="2190" font-weight="700" fill="#ffffff" font-size="24">Per chi decide</text>
    <text x="945" y="2228">numeri uguali ovunque,</text>
    <text x="945" y="2256">dashboard Home e chat</text>
  </g>

  <text x="600" y="2320" text-anchor="middle" font-size="17" fill="#41606f">Trasi · Portierato di Quartiere · Rete delle Case di Quartiere di Brindisi · 2026</text>
</svg>
