name: trasi
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  db_trasi:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 128m
    environment:
      POSTGRES_DB: ${TRASI_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${TRASI_DB}
      TZ: ${TZ}
    command:
    - postgres
    - -c
    - shared_buffers=256MB
    - -c
    - max_connections=100
    - -c
    - work_mem=8MB
    - -c
    - maintenance_work_mem=64MB
    ports:
    - 127.0.0.1:${HOST_PORT_DB}:5432
    volumes:
    - db_trasi_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *id001
    networks:
    - trasi_net
  searxng:
    image: searxng/searxng:2026.9.15-ca4965040
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_PORT: '8080'
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: '8080'
      TZ: ${TZ}
    volumes:
    - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *id001
    networks:
    - trasi_net
  shim:
    build:
      context: ../shim
      dockerfile: Dockerfile
    image: trasi-shim:local
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db_trasi:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRASI_SHIM_KEY: ${TRASI_SHIM_KEY}
      OVERPASS_URL: ${OVERPASS_URL}
      OVERPASS_URL_2: ${OVERPASS_URL_2}
      OVERPASS_TIMEOUT_S: '5'
      SHIM_TIMEOUT_S: '3'
      TZ: ${TZ}
      ONYX_CHAT_TOKEN: ${ONYX_CHAT_TOKEN}
      ONYX_CHAT_API_URL: ${ONYX_CHAT_API_URL:-}
    ports:
    - 127.0.0.1:${HOST_PORT_SHIM}:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *id001
    networks:
    - trasi_net
  nocodb:
    image: nocodb/nocodb:2026.09.0
    restart: unless-stopped
    mem_limit: 1g
    environment:
      PORT: '8080'
      NODE_OPTIONS: --max-old-space-size=768
      NC_TOOL_DIR: /usr/app/data
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_SITE_URL: ${NOCODB_SITE_URL}
      NC_ALLOW_LOCAL_HOSTS: 'true'
      TZ: ${TZ}
    volumes:
    - nocodb_data:/usr/app/data
    ports:
    - 127.0.0.1:${HOST_PORT_NOCODB}:8080
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:8080/api/v1/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *id001
    networks:
    - trasi_net
  metabase:
    image: metabase/metabase:v0.63.18
    restart: unless-stopped
    mem_limit: 2g
    environment:
      JAVA_OPTS: -Xmx1g
      MB_JETTY_PORT: '3000'
      MB_DB_TYPE: ${METABASE_DB_TYPE}
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: ${METABASE_SITE_URL}
      TZ: ${TZ}
    volumes:
    - metabase_data:/metabase-data
    ports:
    - 127.0.0.1:${HOST_PORT_METABASE}:3000
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:3000/api/health
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    logging: *id001
    networks:
    - trasi_net
  activepieces:
    image: activepieces/activepieces:0.91.0
    restart: unless-stopped
    mem_limit: 1.2g
    depends_on:
      ap_postgres:
        condition: service_healthy
      ap_redis:
        condition: service_healthy
    environment:
      AP_CONTAINER_TYPE: WORKER_AND_APP
      AP_PORT: '80'
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${ACTIVEPIECES_SITE_URL}
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_TELEMETRY_ENABLED: 'false'
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY}
      AP_POSTGRES_HOST: ap_postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USER}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DB}
      AP_REDIS_HOST: ap_redis
      AP_REDIS_PORT: '6379'
      TZ: ${TZ}
    volumes:
    - activepieces_data:/usr/src/app/cache
    ports:
    - 127.0.0.1:${HOST_PORT_ACTIVEPIECES}:80
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:80/v1/health
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging: *id001
    networks:
    - trasi_net
  ap_postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    mem_limit: 256m
    shm_size: 64m
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DB}
      POSTGRES_USER: ${AP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
    - activepieces_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *id001
    networks:
    - trasi_net
  ap_redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 64m
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *id001
    networks:
    - trasi_net
  # ---------------------------------------------------------------- Home statica (B6, override Coolify) ----
  # Su Coolify l'ingresso è Traefik: la Home statica è servita da nginx con lo
  # stesso contenuto di ./home che Caddy serviva su onice. Il dominio arriva da
  # docker_compose_domains (label Traefik generate da Coolify).
  home:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    mem_limit: 64m
    volumes:
    - ./home:/usr/share/nginx/html:ro
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:80/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *id001
    networks:
    - trasi_net
networks:
  trasi_net:
    name: trasi_net
    driver: bridge
volumes:
  db_trasi_data: null
  metabase_data: null
  nocodb_data: null
  activepieces_data: null
  activepieces_pg_data: null
