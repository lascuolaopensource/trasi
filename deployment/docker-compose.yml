# Trasi — stack infra (blocco B0)
#
# Convive con Onyx (compose separato, /opt/onyx/deployment/docker_compose) sullo stesso host.
# Regole invarianti:
#   - binding di rete SOLO su 127.0.0.1: la pubblicazione esterna passa dal tunnel Cloudflare;
#   - mem_limit esplicito su OGNI servizio (nessun over-commit: vedi README.md, «avvio selettivo»);
#   - restart: unless-stopped + healthcheck reale su ogni servizio.
#
# Il servizio `shim` implementa un contratto CONGELATO con il worker trasi-shim
# (build ../shim, porta 8000, GET /healthz -> 200, variabili elencate). Non cambiarlo qui.
#
# Uso:  docker compose up -d db_trasi searxng      # solo ciò che serve ai gate B0

name: trasi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- dati (Postgres 16 + PostGIS) ----------
  # Immagine dedicata: quella di Onyx (postgres:15.2-alpine) non ha PostGIS.
  db_trasi:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 128m
    environment:
      POSTGRES_DB: ${TRASI_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # PGDATABASE: fa sì che `psql` senza -d si colleghi al DB Trasi, dove l'immagine
      # carica PostGIS (lo fa su template_postgis e su $POSTGRES_DB, non sul DB "postgres").
      PGDATABASE: ${TRASI_DB}
      TZ: ${TZ}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
    ports:
      - "127.0.0.1:${HOST_PORT_DB}:5432"
    volumes:
      - db_trasi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks: [trasi_net]

  # ---------------------------------------------------------------- ricerca web su allow-list (V-07) -------
  # Interno: lo interroga solo lo shim (http://searxng:8080). Nessuna porta pubblica.
  searxng:
    image: searxng/searxng:2026.9.15-ca4965040
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_PORT: "8080"
      # GRANIAN_* sono le variabili del server WSGI dell'immagine: 0.0.0.0 rende
      # deterministico l'ascolto (il default è "::", che dipende da v6only).
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8080"
      TZ: ${TZ}
    volumes:
      # settings.yml locale: abilita formati html+json (il default ha solo html) e usa_default_settings.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Nessun binding sull'host: SearXNG si raggiunge solo dalla rete Docker
    # (http://searxng:8080), coerente con B0-STK-03 «nessuna porta pubblica».
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks: [trasi_net]

  # ---------------------------------------------------------------- shim FastAPI (contratto V-09) --------
  # Definito ma SPENTO in B0: lo avvia il blocco che lo richiede (B3), prima serve il Dockerfile
  # del worker trasi-shim. Il compose valida anche con ../shim assente.
  shim:
    build:
      context: ../shim
      dockerfile: Dockerfile
    image: trasi-shim:local
    restart: unless-stopped
    mem_limit: 256m
    # Senza questo, lo shim parte insieme a Postgres e il primo tentativo di connessione fallisce mentre il
    # database sta ancora inizializzando: il pool restava `None` per sempre e ogni endpoint tranne `healthz`
    # rispondeva 503 «database non raggiungibile» con il database invece vivo.
    # `condition: service_healthy` rende il ritardo impossibile all'origine; il riavvio a caldo del pool
    # (`pool_pronto`) copre comunque il caso in cui Postgres si riavvii dopo.
    depends_on:
      db_trasi:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRASI_SHIM_KEY: ${TRASI_SHIM_KEY}
      OVERPASS_URL: ${OVERPASS_URL}
      OVERPASS_URL_2: ${OVERPASS_URL_2}
      OVERPASS_TIMEOUT_S: "5"
      SHIM_TIMEOUT_S: "3"
      TZ: ${TZ}
      # Chat dello sportello (`POST /op/chat`): il proxy server-to-server verso Onyx ha bisogno del
      # token, e senza di esso risponde 503 «chat non configurata» invece di rispondere.
      #
      # `ONYX_CHAT_TOKEN` era nel `.env` ma **non era passato qui**: misurato su uno shim avviato senza
      # questa riga, `POST /op/chat` → 503 con la sessione invece valida. Il difetto non si vedeva negli
      # altri test perché la chat è l'unico endpoint che parla con Onyx — tutto il resto funziona senza
      # token, quindi lo stack sembrava completo.
      #
      # **L'indirizzo di Onyx per lo shim è `ONYX_CHAT_API_URL`, e non `ONYX_API_URL`.** Quest'ultimo, nel
      # `.env`, è l'indirizzo per le automazioni e l'export KB (`http://nginx/api`, default di
      # `docker-compose.automazioni.yml`) — container che stanno anche su `onyx_default`, dove l'alias
      # `nginx` risolve. Lo shim sta solo su `trasi_net`, dove non risolve (verificato:
      # `socket.gethostbyname('nginx')` → `Name or service not known`), quindi il suo default è
      # `http://onyx-api_server-1:8080` (200 su `/health` da questa rete). Se serve cambiarlo, si passa
      # `ONYX_CHAT_API_URL`: un nome per rete, così copiare `ONYX_API_URL` dal `.env.example` non può
      # rompere la chat.
      ONYX_CHAT_TOKEN: ${ONYX_CHAT_TOKEN}
      ONYX_CHAT_API_URL: ${ONYX_CHAT_API_URL:-}
      # Dominio pubblico di Onyx, lo stesso di Caddy: lo shim lo restituisce alla Home statica in
      # `GET /op/config` (`onyx_url`), così il tasto «Chiedi» apre l'assistente senza che il JS
      # conosca l'indirizzo. Vuoto → 503 dichiarato su quell'endpoint soltanto.
      ONYX_DOMAIN: ${ONYX_DOMAIN:-}
    ports:
      - "127.0.0.1:${HOST_PORT_SHIM}:8000"
    healthcheck:
      # python3 è presente nell'immagine base dello shim (python:3.12-slim non ha curl/wget).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks: [trasi_net]

  # ---------------------------------------------------------------- CRM + coda proposte (V-06) ------------
  nocodb:
    image: nocodb/nocodb:2026.09.0
    restart: unless-stopped
    # `mem_limit` 1g con heap Node **esplicito**. NocoDB è Node.js: con 512m andava in
    # «JavaScript heap out of memory» durante l'avvio (16 riavvii, `exit=0` e `OOMKilled=false` —
    # moriva *dentro* il processo per limite di heap, non ucciso dal kernel, quindi il sintomo era
    # un container che si riavviava senza un errore di sistema da leggere).
    # `--max-old-space-size` fissa l'heap sotto il tetto del container, lasciando spazio al resto
    # del runtime: è lo stesso criterio di `-Xmx` per Metabase.
    mem_limit: 1g
    environment:
      PORT: "8080"
      NODE_OPTIONS: --max-old-space-size=768
      NC_TOOL_DIR: /usr/app/data
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_SITE_URL: ${NOCODB_SITE_URL}
      # CE 2026 blocca "internal hosts" sulle sorgenti esterne; qui DB e NocoDB vivono
      # nella stessa rete Docker privata (non esposti fuori dal loopback/host), quindi è sicuro.
      NC_ALLOW_LOCAL_HOSTS: "true"
      TZ: ${TZ}
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "127.0.0.1:${HOST_PORT_NOCODB}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging
    networks: [trasi_net]

  # ---------------------------------------------------------------- dashboard (B5) ------------------------
  metabase:
    image: metabase/metabase:v0.63.18
    restart: unless-stopped
    # `mem_limit` 2g con `-Xmx1g`: l'heap JVM resta governato da -Xmx (1 GB), mentre il tetto del
    # container lascia spazio all'overhead fuori dall'heap (metaspace, stack dei thread, GC, mmap).
    # Con 1.5g il container stava al 92-98% del tetto: nessun margine per un picco, e un OOM a metà
    # sessione di test è peggio di 500 MB di tetto in più. L'uso reale sale di ~100-200 MB, non di 500.
    mem_limit: 2g
    environment:
      JAVA_OPTS: -Xmx1g
      MB_JETTY_PORT: "3000"
      MB_DB_TYPE: ${METABASE_DB_TYPE}
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: ${METABASE_SITE_URL}
      TZ: ${TZ}
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "127.0.0.1:${HOST_PORT_METABASE}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    logging: *default-logging
    networks: [trasi_net]

  # ---------------------------------------------------------------- automazioni / flussi (B4) ------------
  # Activepieces vuole Postgres + Redis PROPRI (non condivisi con il dominio Trasi).
  activepieces:
    image: activepieces/activepieces:0.91.0
    restart: unless-stopped
    mem_limit: 1.2g
    depends_on:
      ap_postgres:
        condition: service_healthy
      ap_redis:
        condition: service_healthy
    environment:
      AP_CONTAINER_TYPE: WORKER_AND_APP
      AP_PORT: "80"
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${ACTIVEPIECES_SITE_URL}
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_TELEMETRY_ENABLED: "false"
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY}
      AP_POSTGRES_HOST: ap_postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USER}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DB}
      AP_REDIS_HOST: ap_redis
      AP_REDIS_PORT: "6379"
      TZ: ${TZ}
    volumes:
      - activepieces_data:/usr/src/app/cache
    ports:
      - "127.0.0.1:${HOST_PORT_ACTIVEPIECES}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging: *default-logging
    networks: [trasi_net]

  ap_postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    # Solo metadata e coda di Activepieces: 256m è ampio (l'immagine ufficiale
    # suggerisce pgvector, non serve dimensione da carico analitico).
    mem_limit: 256m
    shm_size: 64m
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DB}
      POSTGRES_USER: ${AP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - activepieces_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [trasi_net]

  ap_redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 64m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks: [trasi_net]

  # ---------------------------------------------------------------- ingresso unico (B6) -------------------
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TRASI_DOMAIN: ${TRASI_DOMAIN}
      ONYX_DOMAIN: ${ONYX_DOMAIN}
      # La chiave dello shim serve alla rotta `/api/shim/*` (riga «Oggi» della Home, B6).
      # **Non** è un segreto iniettato nel JS: la Home è statica e senza autenticazione, quindi
      # la chiave la mette Caddy lato server (`header_up X-Trasi-Key {env.TRASI_SHIM_KEY}`).
      # Senza questo, la chiave finirebbe nel sorgente della pagina, leggibile da chiunque.
      TRASI_SHIM_KEY: ${TRASI_SHIM_KEY}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Trasi Home è un sito statico (deliverable B6): il percorso è dichiarato qui,
      # la directory viene popolata dal blocco UX.
      - ./home:/srv/home:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # L'host ha già onyx-nginx su 127.0.0.1:80 e 127.0.0.1:3000 (compose Onyx):
      # Trasi Caddy usa porte host diverse, sempre su loopback.
      - "127.0.0.1:${HOST_PORT_CADDY_HTTP}:80"
      - "127.0.0.1:${HOST_PORT_CADDY_HTTPS}:443"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks: [trasi_net, onyx_net]

networks:
  trasi_net:
    name: trasi_net
    driver: bridge
  # Rete del compose Onyx (già attiva): serve a Caddy per raggiungere onyx-nginx.
  # `docker compose config` valida anche se la rete non esiste ancora; gli altri
  # servizi non la usano e non ne dipendono.
  onyx_net:
    name: onyx_default
    external: true

volumes:
  db_trasi_data:
  metabase_data:
  nocodb_data:
  activepieces_data:
  activepieces_pg_data:
  caddy_data:
  caddy_config:

# Servizio `automazioni` (B4): flussi notturni con cron. Vive in un file separato perché è di un
# altro owner, ma si **include** qui così l'invocazione del runbook (§8: `docker compose up -d`)
# porta su anche `automazioni` senza doversi ricordare un secondo `-f`.
#
# Nota operativa: `include` **non** avvia nulla da solo. `docker compose up -d db_trasi searxng`
# resta l'avvio selettivo di B0 (RAM), e `automazioni` si accende quando serve:
#     docker compose up -d automazioni
include:
  - docker-compose.automazioni.yml
