<!-- account/conversazioni.html — sezione 7 dell'Account: le conversazioni della Casa, per data.

     Frammento, **solo markup**: nessuno `<script>` qui dentro (`innerHTML` non lo esegue). Il
     comportamento si registra in `window.TrasiAccount.avvii["conversazioni"]` da
     `assets/conversazioni-op.js`, che `account.html` carica (contratto §5.4).

     La fonte è `GET /op/conversazioni` (di BotHome): lista per data, **solo** della Casa della
     sessione, **solo** entro la retention di `[P] gg_retention_chat` giorni. L'apertura di una voce
     porta alla **Home** in modalità chat su quella conversazione: `home.html?c=<id>`.

     SE L'ENDPOINT NON RISPONDE ANCORA, questa sezione mostra lo stato «dati non disponibili» — non
     un errore grezzo e nemmeno una lista vuota. La differenza conta: «nessuna conversazione» e «la
     memoria non risponde» sono due fatti diversi, e confonderli direbbe all'operatore che non ci sono
     conversazioni quando invece non si sa.

     L'elenco è per data, non una tabella: ogni voce è un collegamento con la data del primo turno, il
     titolo (la prima domanda troncata, come la compone lo shim) e il numero dei turni. La retention è
     dichiarata in fondo, perché è un fatto che riguarda tutto ciò che si vede sopra.

     Gli id sono prefissati `acc-conversazioni-…`. -->
<section class="acc-sezione" data-sezione="conversazioni">

  <style>
    .acc-conversazioni-elenco { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--shell-passo) * 3); }
    .acc-conversazioni-voce { display: flex; flex-direction: column; gap: var(--shell-passo); }
    .acc-conversazioni-apertura { font-size: var(--t-corpo-grande, 1.0625rem); }
    .acc-conversazioni-quando, .acc-conversazioni-nota, .acc-conversazioni-stato { margin: 0; font-size: var(--t-minuto, 0.9375rem); color: var(--testo-tenue); }
    .acc-conversazioni-giorno { margin: calc(var(--shell-passo) * 4) 0 calc(var(--shell-passo) * 2); font-size: var(--t-minuto, 0.9375rem); color: var(--testo-tenue); }
  </style>

  <div class="blocco filetto">
    <div class="blocco-testa">
      <h2>Conversazioni</h2>
      <p>
        Le conversazioni della Casa con l'assistente, dalla più recente. Aprire una voce porta alla
        Home su quella conversazione, dove si può continuare.
      </p>
    </div>
    <p class="acc-conversazioni-stato" id="acc-conversazioni-stato" role="status">Lettura in corso…</p>
    <ul class="acc-conversazioni-elenco" id="acc-conversazioni-elenco"></ul>
  </div>

</section>
