    <button class="menu-bottone" type="button" id="shell-menu" aria-expanded="false" aria-controls="sidebar">Menu</button>

    <main class="contenuto" id="contenuto">

      <!-- ======================================================== HOME — non è più la chat ======
           Questa pagina resta per chi la apre da un vecchio segnalibro o da un `?c=<id>` dello
           storico: la conversazione con l'assistente «Trasi Casa» vive in Onyx, l'unica superficie
           di dialogo con l'AI. Appena `GET /op/config` risponde (`window.Trasi.onyx`), si va lì.
           Il `?c=<id>` non viaggia: nell'URL verso Onyx c'è solo l'assistente (V5). -->
      <h1 class="titolo-pagina">La chat è in Onyx</h1>
      <p id="home-rinvio">La conversazione con l'assistente della rete si apre in Onyx: <a id="home-onyx">vai a Onyx</a>.</p>

    </main>
  </div>
</div>

<script src="assets/shell.js?v=3"></script>
<script>
  (function () {
    "use strict";
    var a = document.getElementById("home-onyx");
    if (!window.Trasi || !window.Trasi.onyx) return;
    window.Trasi.onyx.then(function (url) {
      a.setAttribute("href", url);
      a.setAttribute("rel", "noopener");
      location.replace(url);
    }).catch(function () {
      /* Senza l'indirizzo non si inventa niente: la riga lo dice, e il collegamento non c'è. */
      a.removeAttribute("href");
      a.setAttribute("aria-disabled", "true");
      a.textContent = "Onyx non disponibile";
    });
  })();
</script>
