[pytest]
# I test girano dalla radice `flussi/`: `tests/` è la cartella dei test, i moduli dei flussi
# (`comune`, `alert`, `fonti_ical`, `fonti_http`) sono importabili per nome.
testpaths = tests
pythonpath = tests ../flussi
addopts = -q
markers =
    live: richiede il database Trasi (saltato se assente)
