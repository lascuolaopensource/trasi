openapi: 3.0.3
info:
  title: Trasi — Monitoraggio PA
  version: 0.1.0
  description: >-
    I quattro tool del monitoraggio del servizio per la Pubblica Amministrazione (US-4). Onyx li
    registra come secondo tool custom, accanto a quello del contratto congelato (V-09): il dominio
    è lo stesso, ma il canale è separato — solo il ruolo pa (pa@trasi.local) può usarli, e una
    chiamata con un'altra identità restituisce 403. I conteggi sono k-anonimi (§12): le etichette
    `n_label` sono «<5» sotto soglia e «—» a zero, un numero grezzo non esce mai.
servers:
  - url: http://shim:8000/v1/m/USER_EMAIL

paths:
  /report:
    get:
      operationId: monitoraggio_report
      summary: "Elenca i report mensili approvati dell'osservatorio Trasi (più recenti prima), con stato di approvazione, mese di riferimento e conteggi k-anonimi (n_label «<5» se sotto soglia)."
      parameters:
        - name: mese
          in: query
          required: false
          description: Mese in forma YYYY-MM; se omesso, il più recente approvato disponibile.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: I report visibili a questo ruolo (osservatorio, approvati o inviati alla PA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RispostaReport"
        "401":
          description: Chiave shim assente o errata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errore"
        "403":
          description: Identità non riconosciuta o ruolo diverso da `pa`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errore"

  /confronto:
    get:
      operationId: monitoraggio_confronto
      summary: "Confronta i conteggi della rete fra gli ultimi mesi per categoria ed esito, con delta rispetto al mese precedente. I conteggi sono k-anonimi («<5» sotto soglia, mai il numero grezzo)."
      parameters:
        - name: mesi
          in: query
          required: false
          description: Quanti mesi guardare indietro (default 2, massimo 12).
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 2
      responses:
        "200":
          description: Le righe di confronto della rete, ordinate per mese decrescente e categoria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RispostaConfronto"
        "401":
          $ref: "#/components/responses/ChiaveNonValida"
        "403":
          $ref: "#/components/responses/IdentitaNonRiconosciuta"
        "422":
          $ref: "#/components/responses/ParametriNonAmmessi"

  /lacune:
    get:
      operationId: monitoraggio_lacune
      summary: "Mostra le lacune del servizio per il mese: le richieste rimaste senza risposta (per Casa e categoria) e gli errori della chat (sportello + PA), con conteggi k-anonimi. Due elenchi separati, così «manca la risposta» e «il canale non ha funzionato» sono due diagnosi distinte."
      parameters:
        - name: mese
          in: query
          required: false
          description: Mese in forma YYYY-MM; se omesso, il più recente con dati disponibili.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Le lacune del mese, con i conteggi k-anonimi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RispostaLacune"
        "401":
          $ref: "#/components/responses/ChiaveNonValida"
        "403":
          $ref: "#/components/responses/IdentitaNonRiconosciuta"

  /chat_stats:
    get:
      operationId: monitoraggio_chat_stats
      summary: "Riporta l'utilizzo della chat (sportello e PA) per il mese: canale, esito e fonte della risposta, con conteggi k-anonimi. Il testo dei messaggi non è conservato e non compare mai."
      parameters:
        - name: mese
          in: query
          required: false
          description: Mese in forma YYYY-MM; se omesso, il più recente con dati disponibili.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Le righe della vista k-anonima della chat per il mese.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RispostaChatStats"
        "401":
          $ref: "#/components/responses/ChiaveNonValida"
        "403":
          $ref: "#/components/responses/IdentitaNonRiconosciuta"

components:
  responses:
    ChiaveNonValida:
      description: La `X-Trasi-Key` è assente o errata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errore"
    IdentitaNonRiconosciuta:
      description: L'email non è in `identita_onyx` o il ruolo non è `pa`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errore"
    ParametriNonAmmessi:
      description: Parametro fuori forma, valore non ammesso o dato personale riconosciuto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errore"
  schemas:
    ReportItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        casa_id:
          type: integer
          nullable: true
        casa_slug:
          type: string
          nullable: true
        casa_nome:
          type: string
          nullable: true
        mese:
          type: string
          format: date
        ambito:
          type: string
          enum: [casa, osservatorio]
        contenuti:
          type: object
          additionalProperties: true
        generato_ts:
          type: string
          format: date-time
        generato_da:
          type: string
        stato:
          type: string
          enum: [bozza, approvato, inviato_pa]
        commenti:
          type: integer
        ultimo_commento_ts:
          type: string
          format: date-time
          nullable: true
        ha_csv:
          type: boolean

    RispostaReport:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportItem"

    ConfrontoItem:
      type: object
      additionalProperties: false
      properties:
        mese:
          type: string
          format: date
        categoria:
          type: string
        esito:
          type: string
        n:
          type: integer
          nullable: true
          description: Il conteggio come intero, solo se sopra soglia k-anonima.
        n_label:
          type: string
          description: L'etichetta k-anonima («<5», «—», «123»).
        n_prec:
          type: integer
          nullable: true
        n_prec_label:
          type: string
        delta_pct:
          type: number
          nullable: true

    RispostaConfronto:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfrontoItem"

    LacunaRichiesta:
      type: object
      additionalProperties: false
      properties:
        casa_slug:
          type: string
        casa_nome:
          type: string
        categoria:
          type: string
        n:
          type: integer
          nullable: true
        n_label:
          type: string

    LacunaChat:
      type: object
      additionalProperties: false
      properties:
        mese:
          type: string
          format: date
        casa_slug:
          type: string
          nullable: true
        canale:
          type: string
          enum: [sportello, pa]
        esito:
          type: string
          enum: [risposta, errore]
        fonte:
          type: string
          enum: [kb, esterna, nessuna]
        n:
          type: integer
          nullable: true
        n_label:
          type: string

    RispostaLacune:
      type: object
      additionalProperties: false
      properties:
        mese:
          type: string
          format: date
        richieste_non_trovate:
          type: array
          items:
            $ref: "#/components/schemas/LacunaRichiesta"
        chat_errori:
          type: array
          items:
            $ref: "#/components/schemas/LacunaChat"

    ChatStatsItem:
      type: object
      additionalProperties: false
      properties:
        mese:
          type: string
          format: date
        casa_slug:
          type: string
          nullable: true
        canale:
          type: string
          enum: [sportello, pa]
        esito:
          type: string
          enum: [risposta, errore]
        fonte:
          type: string
          enum: [kb, esterna, nessuna]
        n:
          type: integer
          nullable: true
        n_label:
          type: string

    RispostaChatStats:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatStatsItem"

    Errore:
      type: object
      additionalProperties: false
      properties:
        detail:
          type: string
