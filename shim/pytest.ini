[pytest]
# I test girano dalla radice `shim/`: `app` è il pacchetto applicativo, `tests/` è la cartella dei test.
testpaths = tests
# `tests/` è aggiunta a `sys.path` così i moduli di supporto (`attese`) si importano per nome, senza
# che il pacchetto `tests` del sorgente di Onyx (presente su questa macchina) venga a collidere.
pythonpath = tests .
addopts = -q
